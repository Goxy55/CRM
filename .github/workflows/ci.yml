name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://crm:crm@127.0.0.1:5432/crm_test
      E2E_DATABASE_URL: postgresql://crm:crm@127.0.0.1:5432/crm_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Aplikacija odbija superuser nalog jer on zaobilazi RLS; testovi koriste običan nalog.
      - run: |
          psql postgresql://postgres:postgres@127.0.0.1:5432/postgres \
            -c "CREATE ROLE crm LOGIN PASSWORD 'crm'" \
            -c "CREATE DATABASE crm_test OWNER crm" \
            -c "CREATE DATABASE crm_e2e OWNER crm"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://crm:crm@127.0.0.1:5432/crm_e2e
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
