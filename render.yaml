# Predlog objave na Render (aplikacija + PostgreSQL). Ništa se ne kreira dok
# vlasnik u svom Render nalogu ne potvrdi resurse i trošak. Nije isprobano na
# stvarnom Render nalogu; vidi DEPLOYMENT.md.
services:
  - type: web
    name: crm-test
    runtime: node
    region: frankfurt
    plan: starter
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_URL
        fromService:
          name: crm-test
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: crm-test-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Ključevi za JMBG. Posle prve objave se NE SMEJU menjati: sa drugim
      # ključem se već upisani JMBG-ovi više ne mogu pročitati.
      - key: JMBG_ENCRYPTION_KEY
        generateValue: true
      - key: JMBG_INDEX_KEY
        generateValue: true
      # SMTP_URL i MAIL_FROM se dodaju kasnije u Environment (vidi docs/RENDER.md).

databases:
  - name: crm-test-db
    region: frankfurt
    postgresMajorVersion: "16"
    plan: basic-256mb
    ipAllowList: []
