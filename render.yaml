# Predlog objave na Render (aplikacija + PostgreSQL). Ništa se ne kreira dok
# vlasnik u svom Render nalogu ne potvrdi resurse i trošak. Nije isprobano na
# stvarnom Render nalogu; vidi DEPLOYMENT.md.
services:
  - type: web
    name: crm
    runtime: node
    region: frankfurt
    plan: starter
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_URL
        fromService:
          name: crm
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Svaki: 64 heksadecimalna znaka (openssl rand -hex 32). Unose se ručno.
      - key: JMBG_ENCRYPTION_KEY
        sync: false
      - key: JMBG_INDEX_KEY
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: crm-db
    region: frankfurt
    postgresMajorVersion: "16"
    plan: basic-256mb
    ipAllowList: []
